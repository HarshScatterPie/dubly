name: CI

# Every push/PR: typecheck, tests against a throwaway MongoDB (never real data), build, dependency audit, secret scan and image build; nothing deploys.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # A throwaway single-node replica set; tests use their own dubly_test database in it.
      - name: Start MongoDB
        run: bash .github/scripts/start-mongo.sh

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (MongoDB)
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/dubly_test?directConnection=true
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # Surfaces the end of the test output as an annotation, readable on the run page (and via the API) without admin rights.
      - name: Report test output on failure
        if: failure()
        run: |
          tail -n 60 test-output.txt | sed -E 's/\x1b\[[0-9;]*m//g' > tail.txt || true
          docker logs dubly-mongo 2>&1 | tail -n 15 >> tail.txt || true
          body=$(sed -e 's/%/%25/g' tail.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Test output (last lines)::${body}"

      - name: Build frontend
        run: npm run build

      # Fails on high/critical advisories in production dependencies; moderate ones are tracked in docs/SECURITY.md.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          extra_args: --results=verified,unknown

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - name: Build production image (not pushed)
        run: docker build -t dubly:ci .
      - name: Image has a working ffmpeg and deep-filter and starts its runtime
        run: |
          docker run --rm --entrypoint ffmpeg dubly:ci -hide_banner -version | head -1
          docker run --rm --entrypoint /app/server/bin/deep-filter dubly:ci --version
          docker run --rm --entrypoint node dubly:ci -e "require('fs').accessSync('dist/index.html'); console.log('frontend bundle present')"
      # The one-container deployment (compose.yaml): the first start initiates MongoDB's replica set and creates its logins, a restart
      # reuses them, and a stop drains the app before MongoDB shuts down cleanly.
      - name: Container starts with its own MongoDB, restarts, and stops cleanly
        run: |
          set -euo pipefail
          healthy() {
            for _ in $(seq 1 90); do
              if curl -fsS http://127.0.0.1:8787/api/healthz; then echo; return 0; fi
              sleep 2
            done
            docker logs dubly-ci 2>&1 | tail -60
            return 1
          }
          docker run -d --name dubly-ci -p 127.0.0.1:8787:8787 dubly:ci
          healthy
          curl -fsS http://127.0.0.1:8787/ | grep -q 'id="root"'
          docker restart -t 60 dubly-ci
          healthy
          docker stop -t 60 dubly-ci
          docker logs dubly-ci 2>&1 | tail -8
          test "$(docker inspect -f '{{.State.ExitCode}}' dubly-ci)" = 0
